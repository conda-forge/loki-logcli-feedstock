schema_version: 1

context:
  version: "3.7.7"

package:
  name: loki-logcli
  version: ${{ version }}

source:
  url: https://github.com/grafana/loki/archive/v${{ version }}.tar.gz
  sha256: e2e8863c15ad97a4649a6f0795d549a8977e44f4413e2b001e6eb0c12c22eb9c
  target_directory: src

build:
  number: 0
  script:
    - cd src
    - go-licenses save ./cmd/logcli --save_path ../library_licenses --ignore github.com/grafana/loki --ignore github.com/jmespath/go-jmespath --ignore github.com/apache/thrift --ignore go.opentelemetry.io/otel/exporters/jaeger --ignore github.com/coder/quartz
    - cd cmd/logcli
    - if: win
      then: go build -v -o %LIBRARY_BIN%\logcli.exe
      else: go build -v -o $PREFIX/bin/logcli

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script:
      - logcli --version

about:
  homepage: https://github.com/grafana/loki
  license: AGPL-3.0-only
  license_file:
    - src/LICENSE
    - library_licenses/
  summary: 'LogCLI: Grafana Loki command-line interface'

extra:
  recipe-maintainers:
    - delsner
    - trim21
